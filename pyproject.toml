[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-contenido"
version = "0.1.0"
description = "Agente de IA que convierte una idea en guion y video corto vertical (TikTok, Reels, Shorts)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["edge-tts>=6.1"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
agente-contenido = "agente_contenido.cli:main"

[tool.setuptools]
packages = ["agente_contenido"]
